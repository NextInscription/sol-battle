[package]
name = "battle-game"
version = "0.1.0"
description = "Async 1v1 betting game with commit-reveal fairness"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "battle_game"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
sha3 = "0.10"
